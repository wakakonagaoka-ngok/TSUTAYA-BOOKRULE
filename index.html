<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18324a">
<title>BOOK RULE prototype</title>
<style>
:root{--navy:#18324a;--blue:#2d5877;--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#66727d;--line:#dce2e7;--good:#18794e;--warn:#a56800;--bad:#a43a3a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:white;padding:20px 18px 18px;position:sticky;top:0;z-index:5}header .brand{font-weight:800;letter-spacing:.08em;font-size:20px}header small{opacity:.75}
main{max-width:760px;margin:auto;padding:18px 14px 42px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
button{border:0;border-radius:12px;padding:13px 12px;font-weight:700;font-size:14px;cursor:pointer}.tab{background:white;color:var(--navy);border:1px solid var(--line)}.tab.active{background:var(--navy);color:white}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
h1{font-size:22px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cfd7de;border-radius:10px;background:white;font-size:16px}textarea{min-height:110px;resize:vertical}
.primary{background:var(--navy);color:white;width:100%;margin-top:14px}.secondary{background:#edf1f4;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border-left:5px solid var(--good);background:#f0faf5;padding:15px;border-radius:10px;margin-top:14px}.result.warn{border-color:var(--warn);background:#fff8e8}.result.bad{border-color:var(--bad);background:#fff1f1}.big{font-size:24px;font-weight:850;margin:5px 0 8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf1f4;font-size:12px;margin:2px}.hidden{display:none}.rule{white-space:pre-wrap;line-height:1.7}.note{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header><div class="brand">BOOK RULE</div><small>店舗業務ルール・プロトタイプ</small></header>
<main>
<div class="tabs">
<button class="tab active" onclick="show('search',this)">🔎 本を検索</button>
<button class="tab" onclick="show('judge',this)">📦 抜き取り判定</button>
<button class="tab" onclick="show('admin',this)">⚙️ 管理者</button>
</div>

<section id="search">
<div class="card">
<h1>ISBN検索</h1><div class="muted">通常本はISBN登録不要。登録済みの例外ISBNだけ検索できます。</div>
<label>ISBN</label><input id="isbn" inputmode="numeric" placeholder="978XXXXXXXXXX">
<button class="primary" onclick="searchISBN()">検索</button>
<button class="secondary" style="width:100%;margin-top:8px" onclick="alert('プロトタイプではカメラ起動の入口のみです。公開版でバーコード読み取りを接続します。')">📷 バーコードを読み取る</button>
<div id="isbnResult"></div>
</div>
<div class="card"><h2>📚 品出しルール</h2>
<label>ジャンル</label><select id="genre"><option>国内文庫</option><option>時代文庫</option></select>
<div class="rule">現在登録されているルール

【国内文庫・時代文庫／新刊】
発売日から1ヶ月未満：この抜き取りルールの対象外

※品出しルールは、今後ジャンルごとに文章を登録して検索表示できるようにします。</div>
</div>
</section>

<section id="judge" class="hidden">
<div class="card">
<h1>抜き取り判定</h1><div class="muted">国内文庫・時代文庫の仮ルールを反映しています。</div>
<div class="grid2">
<div><label>ジャンル</label><select id="jgenre"><option>国内文庫</option><option>時代文庫</option></select></div>
<div><label>条件</label><select id="condition"><option>新刊</option><option>その他</option></select></div>
</div>
<div class="grid2">
<div><label>発売日</label><input id="release" type="date"></div>
<div><label>未稼働日数</label><input id="inactive" type="number" min="0" placeholder="例：24"></div>
</div>
<div class="grid2">
<div><label>累計販売数</label><input id="total" type="number" min="0" placeholder="例：4"></div>
<div><label>大ジャンルランク</label><select id="rank"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
</div>
<label>30日の実績</label><input id="recent30" type="number" min="0" placeholder="例：2">
<button class="primary" onclick="judge()">判定する</button>
<div id="judgeResult"></div>
</div>
</section>

<section id="admin" class="hidden">
<div class="card"><h1>管理者メニュー</h1><div class="muted">プロトタイプでは登録内容をこの端末内に保存します。</div>
<h2 style="margin-top:18px">ISBN例外登録</h2>
<label>ISBN</label><input id="aIsbn" inputmode="numeric" placeholder="978XXXXXXXXXX">
<label>タイトル（任意）</label><input id="aTitle" placeholder="例：○○○">
<label>種類</label><select id="aType"><option>与件</option><option>地域本</option><option>返本禁止</option><option>その他</option></select>
<label>抜き取り設定</label><select id="aAction"><option>抜き取り禁止</option><option>1冊残す</option><option>2冊残す</option><option>3冊残す</option><option>通常ルールに従う</option></select>
<label>備考</label><textarea id="aNote" placeholder="管理者向けメモ"></textarea>
<button class="primary" onclick="saveException()">登録する</button>
<div id="adminList"></div>
</div>
</section>
</main>
<script>
const exceptions=JSON.parse(localStorage.getItem('bookExceptions')||'{}');
function show(id,btn){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='admin')renderList()}
function searchISBN(){let i=document.getElementById('isbn').value.replace(/[-\\s]/g,'');let e=exceptions[i];document.getElementById('isbnResult').innerHTML=e?`<div class="result warn"><span class="pill">${e.type}</span><div class="big">${e.action}</div><b>${e.title||'登録ISBN'}</b><div class="note">${e.note||''}</div></div>`:`<div class="result"><b>登録された例外ISBNではありません</b><div class="note">通常ルールで判定します。</div></div>`}
function judge(){
let rel=document.getElementById('release').value, inactive=+document.getElementById('inactive').value,total=+document.getElementById('total').value;
let out=document.getElementById('judgeResult');
if(!rel){out.innerHTML='<div class="result bad">発売日を入力してください。</div>';return}
let d=new Date(rel), today=new Date();d.setHours(0,0,0,0);today.setHours(0,0,0,0);
let cutoff=new Date(today);cutoff.setMonth(cutoff.getMonth()-1);
if(d>cutoff){out.innerHTML=`<div class="result warn"><div class="big">判定対象外</div>発売から1ヶ月未満です。<div class="note">この抜き取りルールは発売から1ヶ月経過後に適用されます。</div></div>`;return}
let text='';
if(total<=1){text='<div class="big">1冊残し</div>カタログに差し落とし';}
else if(total>=7){text='<div class="big">抜き取りなし</div>ピックアップ棚に置きっぱなし、もしくは新刊棚前平台に1〜2面';}
else if(inactive<=20 && total>=3 && total<=6){text='<div class="big">抜き取りなし</div>新刊棚前平台に7冊まで・1面';}
else if(total>=2){text='<div class="big">3冊残し</div>カタログ平台もしくは差し落とし';}
else{text='<div class="big">追加確認が必要</div>現在の登録ルールではこの条件を一意に判定できません。';}
out.innerHTML=`<div class="result">${text}<hr><b>判定理由</b><div class="note">発売から1ヶ月以上／未稼働 ${inactive}日／累計販売 ${total}冊</div></div>`;
}
function saveException(){let i=document.getElementById('aIsbn').value.replace(/[-\\s]/g,'');if(!i){alert('ISBNを入力してください');return}exceptions[i]={title:document.getElementById('aTitle').value,type:document.getElementById('aType').value,action:document.getElementById('aAction').value,note:document.getElementById('aNote').value};localStorage.setItem('bookExceptions',JSON.stringify(exceptions));renderList();alert('登録しました');}
function renderList(){let arr=Object.entries(exceptions);document.getElementById('adminList').innerHTML='<h2 style="margin-top:22px">登録済みISBN</h2>'+ (arr.length?arr.map(([i,e])=>`<div class="card" style="margin:8px 0;padding:12px"><b>${i}</b><br>${e.title||''} <span class="pill">${e.type}</span><br><strong>${e.action}</strong><div class="note">${e.note||''}</div></div>`).join(''):'<div class="muted">まだありません。</div>')}
</script>
</body></html>
